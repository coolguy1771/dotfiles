version: 1
git_protocol: ssh
editor: nvim
prompt: enabled
prefer_editor_prompt: disabled
pager:
aliases:
  co: pr checkout
  pv: pr view --web
  prc: pr create --web
  prl: pr list
  rv: repo view --web
http_unix_socket:
browser:
color_labels: enabled
accessible_colors: disabled
accessible_prompter: disabled
spinner: enabled
