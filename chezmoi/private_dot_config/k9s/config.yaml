k9s:
  liveViewAutoRefresh: false
  refreshRate: 2
  maxConnRetry: 5
  enableMouse: true
  headless: false
  crumbsless: false
  logoless: false
  splashless: false
  readOnly: false
  noExitOnCtrlC: false
  ui:
    skin: dracula
    enableMouse: true
    headless: false
    logoless: false
    crumbsless: false
    noIcons: false
